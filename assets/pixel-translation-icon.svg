<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="像素译站图标">
  <!-- 像素译站 应用图标 v4（SVG 手绘像素风 · 无文字版）
       设计：米白圆角底 + 深绿勾边对话气泡（翻译）+ 内嵌 3D 等距像素方块（被翻译的方块）
             + 气泡下方分割进度条。已删「像素译站」文字——所有尺寸统一用本图（小图标也清晰）。
       配色：米白底 #f5f1e6 / 深绿勾边 #1f3a29 / 荧光绿 #c8e96a / 苔绿 #3f6548 -->

  <!-- ── 背景：应用 UI 同款米白底（单个圆角外缘 rx=9） ── -->
  <rect x="0" y="0" width="64" height="64" rx="9" fill="#f5f1e6"/>

  <!-- ── 对话气泡（翻译）：深绿勾边 + 米白主体（简洁直角矩形；整体下移 2.4px） ── -->
  <rect x="8"  y="8.4" width="48" height="38" fill="#1f3a29"/>
  <rect x="12" y="12.4" width="40" height="30" fill="#f5f1e6"/>

  <!-- ── 气泡内：3D 等距像素方块（Minecraft 方块 = 像素；在气泡里 = 被翻译的方块） ── -->
  <!-- 顶面（荧光绿） -->
  <polygon points="32,19.6 44,25.6 32,31.6 20,25.6" fill="#c8e96a"/>
  <!-- 左面（苔绿） -->
  <polygon points="20,25.6 32,31.6 32,37.6 20,31.6" fill="#3f6548"/>
  <!-- 右面（深苔绿） -->
  <polygon points="32,31.6 44,25.6 44,31.6 32,37.6" fill="#2a4a38"/>

  <!-- ── 气泡下方：分割进度条（像素风分段，进度满 100%）——
       深苔绿轨道（上下 + 左右 2px 边框）+ 4 格荧光绿填充，格子间 4px 缝隙露出轨道色。
       格布局：格子区 x10~54（左右各留 2px 边框），4×8px 格子 + 3×4px 缝隙 = 44px -->
  <rect x="8"  y="48.4" width="48" height="8" fill="#2a4a38"/>
  <rect x="10" y="50.4" width="8" height="4" fill="#c8e96a"/>
  <rect x="22" y="50.4" width="8" height="4" fill="#c8e96a"/>
  <rect x="34" y="50.4" width="8" height="4" fill="#c8e96a"/>
  <rect x="46" y="50.4" width="8" height="4" fill="#c8e96a"/>
</svg>
